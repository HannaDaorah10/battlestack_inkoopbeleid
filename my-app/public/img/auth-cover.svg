<!-- Adjust design system: inkt-vlak met zand-accenten. Geen kleurverlopen buiten
     het merkpalet, geen rode vlakken — rood blijft de actiekleur. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
    <rect width="600" height="800" fill="#13222C" />
    <g fill="none" stroke="#E6DDC5" stroke-width="1.5" opacity="0.09">
        <circle cx="430" cy="300" r="130" />
        <circle cx="430" cy="300" r="210" />
        <circle cx="430" cy="300" r="290" />
        <circle cx="430" cy="300" r="370" />
    </g>
</svg>
