# Generated by battlestack. Per-project dev services (postgres + mailpit + rustfs + redis).
name: my-app

services:
    migrate:
        profiles: ["prod"]
        image: my-app:dev
        command: ["node", "/app/server/migrate.mjs"]
        env_file: .env
        environment:
            NUXT_DATABASE_URL: postgres://postgres:postgres@db:5432/${DB_NAME:-app}
        depends_on:
            db:
                condition: service_healthy

    seed:
        profiles: ["prod"]
        image: my-app:dev
        command: ["node", "/app/server/seed.mjs"]
        env_file: .env
        environment:
            NUXT_DATABASE_URL: postgres://postgres:postgres@db:5432/${DB_NAME:-app}
        depends_on:
            db:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully

    app:
        profiles: ["prod"]
        build:
            context: .
            args:
                BUILD_NUMBER: dev
        image: my-app:dev
        restart: unless-stopped
        env_file: .env
        environment:
            NUXT_HOST: 0.0.0.0
            NUXT_PORT: "3000"
            NUXT_DATABASE_URL: postgres://postgres:postgres@db:5432/${DB_NAME:-app}
            NUXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-13472}}
            NUXT_SMTP_HOST: mailpit
            NUXT_SMTP_PORT: "1025"
            NUXT_SMTP_REQUIRE_TLS: "false"
            NUXT_S3_ENDPOINT: http://rustfs:9000
            NUXT_REDIS_URL: redis://redis:6379
        ports:
            - "${APP_PORT:-13472}:3000"
        depends_on:
            db:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
            seed:
                condition: service_completed_successfully
            mailpit:
                condition: service_started
            rustfs:
                condition: service_started
            redis:
                condition: service_started

    db:
        image: pgvector/pgvector:pg18
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_NAME:-app}
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "${DB_PORT:-16120}:5432"
        volumes:
            - db_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-app}"]
            interval: 5s
            timeout: 5s
            retries: 10

    mailpit:
        image: axllent/mailpit:latest
        restart: unless-stopped
        environment:
            MP_MAX_MESSAGES: "5000"
            MP_DATABASE: "/data/mailpit.db"
        ports:
            - "${SMTP_PORT:-11789}:1025"
            - "${MAIL_UI_PORT:-18612}:8025"
        volumes:
            - mailpit_data:/data

    rustfs:
        image: rustfs/rustfs:latest
        restart: unless-stopped
        environment:
            RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
            RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
            RUSTFS_ADDRESS: ":9000"
            RUSTFS_CONSOLE_ENABLE: "true"
            RUSTFS_CONSOLE_ADDRESS: ":9001"
        ports:
            - "${S3_API_PORT:-19022}:9000"
            - "${S3_CONSOLE_PORT:-19563}:9001"
        volumes:
            - rustfs_data:/data

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - "${REDIS_PORT:-17099}:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    db_data:
    mailpit_data:
    rustfs_data:
